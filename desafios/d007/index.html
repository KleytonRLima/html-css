<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem flexível</title>
</head>
<body>
    <h1>Imagem flexível</h1>
    <p>Você está vendo a completa? Experimente ampliar o tamanho da sua janela para aproveitar melhor experiência &#x1F631;</p>

    <picture>
        <source media="(max-width: 550px)" srcset="imagens/paisagem-500.jpg">
        <source media="(max-width: 750px)" srcset="imagens/paisagem-700.jpg" type="image/jpg">
        <source media="(max-width: 1050px)" srcset="imagens/paisagem-1000.jpg" type="image/jpg">
        <img src="imagens/paisagem-300.jpg" alt="Imagem flexível">
    </picture>
</body>
</html>
