<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borda Personalizada</title>
    <style>
        h1{
            border: 12px solid black;
            padding: 10px;
            border-image-source: url('borda.png');
            border-image-slice: 27;
            border-image-repeat: repeat;
            /*pode se usar tbm um short end
            border-image: url('borda.png') 27 repeat;
            border-image-repeat: stretch;- Esse faz com que a borda fique esticada*/        
        }
    </style>
</head>
<body>
    <h1>Teste de Borda</h1>
</body>
</html>
